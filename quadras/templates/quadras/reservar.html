{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playce | Reservar {{ quadra.nome }}</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/globals.css' %}">
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/quadras.css' %}">
</head>
<body>

    {% include 'partials/navbar.html' %}
    {% include 'partials/messages.html' %}

    <div class="reserva-container">
        <a href="{% url 'quadras' %}" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar para quadras</a>

        <div class="reserva-card">
            <h2>Reservar {{ quadra.nome }}</h2>
            <p class="subtitulo">{{ quadra.get_tipo_display }} · R$ {{ quadra.preco_hora }} / hora</p>

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="nome_cliente">Nome do responsável</label>
                    <input type="text" id="nome_cliente" name="nome_cliente" value="{{ nome_padrao }}" required placeholder="Seu nome completo">
                </div>

                <div class="form-group">
                    <label for="contato_cliente">Telefone / Contato</label>
                    <input type="text" id="contato_cliente" name="contato_cliente" value="{{ contato_padrao }}" required placeholder="E-mail ou telefone">
                </div>

                <div class="form-group">
                    <label for="data">Data</label>
                    <input type="date" id="data" name="data" required min="{{ hoje }}">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="hora_inicio">Horário de início</label>
                        <input type="time" id="hora_inicio" name="hora_inicio" required>
                    </div>
                    <div class="form-group">
                        <label for="hora_fim">Horário de fim</label>
                        <input type="time" id="hora_fim" name="hora_fim" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Tipo de partida</label>
                    <div class="visibilidade-opcoes">
                        <label class="opcao-visibilidade">
                            <input type="radio" name="visibilidade" value="PRI" checked>
                            <div class="opcao-card">
                                <i class="fa-solid fa-lock"></i>
                                <strong>Privada</strong>
                                <span>Só quem reservou usa a quadra</span>
                            </div>
                        </label>
                        <label class="opcao-visibilidade">
                            <input type="radio" name="visibilidade" value="PUB">
                            <div class="opcao-card">
                                <i class="fa-solid fa-users"></i>
                                <strong>Pública</strong>
                                <span>Outras pessoas podem entrar para jogar ({{ vagas_publica_padrao }} vagas)</span>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-confirmar">
                    Confirmar reserva
                </button>
            </form>
        </div>
    </div>

</body>
</html>
